<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>__REPORT_TITLE__ · FailLens</title>
  <style>
    :root {
      --brand: #5b5bd6; --brand-strong: #4545c4; --brand-soft: #eeeeff;
      --success: #15966f; --success-soft: #e8f7f1; --danger: #dc4c64; --danger-soft: #fff0f2;
      --warning: #cf7a17; --warning-soft: #fff6e7; --info: #3b78d8; --info-soft: #edf4ff;
      --ink: #1b1f2a; --text: #353a48; --muted: #717789; --faint: #a2a8b6;
      --canvas: #f5f6fa; --surface: #ffffff; --surface-2: #fafbfc; --line: #e7e9ef;
      --shadow: 0 1px 2px rgba(24, 29, 44, .03), 0 8px 28px rgba(24, 29, 44, .055);
      --sidebar: #171923; --sidebar-text: #aeb3c5; --radius: 14px;
    }
    [data-theme="dark"] {
      --brand: #8b8bf4; --brand-strong: #a1a1ff; --brand-soft: #2b2b50;
      --success: #45c79e; --success-soft: #17372f; --danger: #ff7890; --danger-soft: #43242d;
      --warning: #f0aa54; --warning-soft: #3f3120; --info: #77a9f5; --info-soft: #233652;
      --ink: #f0f1f5; --text: #d8dae2; --muted: #999faf; --faint: #6f7585;
      --canvas: #11131a; --surface: #1a1d27; --surface-2: #20232e; --line: #2d303c;

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: var(--canvas); color: var(--text); font: 14px/1.55 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
    button, input, select { font: inherit; }
    button { color: inherit; }
    a { color: inherit; }
    svg { display: block; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .app { min-height: 100vh; }
    .sidebar { position: fixed; inset: 0 auto 0 0; width: 244px; background: var(--sidebar); color: var(--sidebar-text); padding: 26px 18px; display: flex; flex-direction: column; z-index: 20; }
    .logo { display: flex; align-items: center; gap: 12px; padding: 0 10px 30px; color: #fff; }
    .logo-mark { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: #6868e8; box-shadow: 0 8px 22px rgba(104,104,232,.35); }
    .logo-mark svg { width: 19px; height: 19px; }
    .logo strong { display: block; font-size: 16px; letter-spacing: -.01em; }
    .logo small { display: block; color: #777e93; font-size: 10px; letter-spacing: .12em; margin-top: 1px; }
    .nav-label { padding: 0 12px 8px; color: #666d81; font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    .nav { display: grid; gap: 5px; }
    .nav button { width: 100%; border: 0; background: transparent; color: inherit; padding: 10px 12px; border-radius: 9px; display: flex; gap: 11px; align-items: center; cursor: pointer; text-align: left; transition: .18s ease; }
    .nav button:hover { color: #fff; background: rgba(255,255,255,.05); }
    .nav button.active { color: #fff; background: rgba(117,117,242,.17); }
    .nav button svg { width: 17px; height: 17px; opacity: .85; }
    .nav-count { margin-left: auto; min-width: 22px; padding: 1px 6px; border-radius: 8px; background: rgba(255,255,255,.08); text-align: center; font-size: 11px; }
    .side-status { margin-top: auto; padding: 14px; border: 1px solid rgba(255,255,255,.07); border-radius: 11px; background: rgba(255,255,255,.025); }
    .side-status-head { display: flex; align-items: center; gap: 8px; color: #d7dae4; font-size: 12px; font-weight: 650; }
    .pulse { width: 7px; height: 7px; border-radius: 50%; background: #43d6a6; box-shadow: 0 0 0 4px rgba(67,214,166,.12); }
    .side-status p { margin: 7px 0 0; color: #6f768a; font-size: 11px; }
    .shell { margin-left: 244px; min-height: 100vh; }
    .topbar { height: 70px; padding: 0 34px; display: flex; align-items: center; justify-content: space-between; gap: 20px; background: color-mix(in srgb, var(--surface) 92%, transparent); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 15; backdrop-filter: blur(14px); }
    .breadcrumbs { color: var(--muted); font-size: 12px; }
    .breadcrumbs b { color: var(--ink); font-weight: 650; }
    .top-actions { display: flex; align-items: center; gap: 8px; }
    .icon-btn, .export-btn { height: 36px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; text-decoration: none; }
    .icon-btn { width: 36px; }
    .icon-btn svg, .export-btn svg { width: 16px; height: 16px; }
    .export-btn { gap: 8px; padding: 0 13px; font-size: 12px; font-weight: 650; }
    .content { max-width: 1480px; margin: auto; padding: 32px 34px 64px; }
    .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 25px; }
    .page-head h1 { margin: 0; color: var(--ink); font-size: 26px; line-height: 1.25; letter-spacing: -.025em; }
    .page-head p { margin: 7px 0 0; color: var(--muted); font-size: 13px; }
    .run-pill { display: flex; align-items: center; gap: 8px; padding: 8px 11px; border: 1px solid var(--line); background: var(--surface); border-radius: 9px; color: var(--muted); font-size: 12px; white-space: nowrap; }
    .run-pill span { width: 7px; height: 7px; border-radius: 50%; background: var(--success); }
    .view { display: none; animation: enter .24s ease both; }
    .view.active { display: block; }
    @keyframes enter { from { opacity: 0; transform: translateY(4px); } }
    .metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
    .metric { position: relative; overflow: hidden; min-height: 128px; padding: 20px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); }
    .metric-top { display: flex; justify-content: space-between; align-items: center; }
    .metric-label { color: var(--muted); font-size: 12px; font-weight: 650; }
    .metric-icon { width: 31px; height: 31px; border-radius: 9px; display: grid; place-items: center; color: var(--brand); background: var(--brand-soft); }
    .metric-icon svg { width: 15px; height: 15px; }
    .metric-value { margin-top: 13px; color: var(--ink); font-size: 30px; line-height: 1; font-weight: 750; letter-spacing: -.035em; }
    .metric-note { margin-top: 8px; color: var(--muted); font-size: 11px; }
    .metric-note strong { color: var(--success); font-weight: 700; }
    .grid-main { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(300px, .75fr); gap: 14px; margin-top: 14px; }
    .panel { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); }
    .panel-head { min-height: 63px; padding: 16px 19px; display: flex; align-items: center; justify-content: space-between; gap: 14px; border-bottom: 1px solid var(--line); }
    .panel-title { color: var(--ink); font-weight: 700; font-size: 14px; }
    .panel-subtitle { margin-top: 2px; color: var(--muted); font-size: 11px; }
    .legend { display: flex; gap: 15px; color: var(--muted); font-size: 11px; }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .legend i { width: 7px; height: 7px; border-radius: 50%; }
    .chart-wrap { height: 270px; padding: 18px 20px 12px; }
    .chart-wrap svg { width: 100%; height: 100%; overflow: visible; }
    .chart-label { fill: var(--muted); font-size: 10px; }
    .chart-grid { stroke: var(--line); stroke-width: 1; }
    .chart-line { fill: none; stroke: var(--brand); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .chart-area { fill: url(#areaGradient); opacity: .32; }
    .chart-dot { fill: var(--surface); stroke: var(--brand); stroke-width: 2.5; }
    .distribution { padding: 20px; }
    .donut-row { display: grid; grid-template-columns: 138px 1fr; gap: 20px; align-items: center; }
    .donut { width: 138px; aspect-ratio: 1; border-radius: 50%; position: relative; display: grid; place-items: center; }
    .donut::after { content: ""; position: absolute; width: 88px; aspect-ratio: 1; border-radius: 50%; background: var(--surface); }
    .donut-center { position: relative; z-index: 1; text-align: center; }
    .donut-center strong { display: block; color: var(--ink); font-size: 25px; line-height: 1.1; }
    .donut-center span { color: var(--muted); font-size: 10px; }
    .category-list { display: grid; gap: 10px; }
    .category { display: grid; grid-template-columns: 8px minmax(0,1fr) auto; align-items: center; gap: 8px; font-size: 11px; }
    .category i { width: 7px; height: 7px; border-radius: 50%; }
    .category span { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .category b { color: var(--ink); }
    .section-row { display: flex; align-items: center; justify-content: space-between; margin: 25px 0 11px; }
    .section-row h2 { margin: 0; color: var(--ink); font-size: 15px; }
    .text-btn { border: 0; padding: 4px; background: transparent; color: var(--brand); font-size: 12px; cursor: pointer; }
    .table-wrap { overflow: auto; }
    table { width: 100%; border-collapse: collapse; }
    th { padding: 11px 16px; text-align: left; color: var(--muted); background: var(--surface-2); border-bottom: 1px solid var(--line); font-size: 10px; font-weight: 700; letter-spacing: .045em; text-transform: uppercase; white-space: nowrap; }
    td { padding: 13px 16px; border-bottom: 1px solid var(--line); font-size: 12px; }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr[data-action] { cursor: pointer; transition: background .15s; }
    tbody tr[data-action]:hover { background: var(--surface-2); }
    .test-name { max-width: 420px; color: var(--ink); font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 11px; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .badge { display: inline-flex; align-items: center; gap: 6px; min-height: 23px; padding: 2px 8px; border-radius: 7px; font-size: 10px; font-weight: 700; white-space: nowrap; }
    .badge::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
    .badge.danger { color: var(--danger); background: var(--danger-soft); }
    .badge.success { color: var(--success); background: var(--success-soft); }
    .badge.warning { color: var(--warning); background: var(--warning-soft); }
    .badge.info { color: var(--info); background: var(--info-soft); }
    .confidence { display: flex; align-items: center; gap: 9px; color: var(--muted); }
    .confidence-track, .risk-track { width: 66px; height: 5px; border-radius: 999px; background: var(--line); overflow: hidden; }
    .confidence-track i, .risk-track i { display: block; height: 100%; border-radius: inherit; background: var(--brand); }
    .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; }
    .search { position: relative; flex: 1; }
    .search svg { position: absolute; left: 12px; top: 50%; width: 15px; height: 15px; color: var(--muted); transform: translateY(-50%); }
    .search input, .select { width: 100%; height: 40px; border: 1px solid var(--line); border-radius: 9px; outline: none; background: var(--surface); color: var(--text); transition: .15s; }
    .search input { padding: 0 13px 0 37px; }
    .select { width: 180px; padding: 0 10px; }
    .search input:focus, .select:focus { border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 13%, transparent); }
    .issues-list { display: grid; gap: 10px; }
    .issue { padding: 17px 18px; display: grid; grid-template-columns: 34px minmax(0,1fr) auto; gap: 14px; align-items: start; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); cursor: pointer; transition: .18s ease; }
    .issue:hover { border-color: color-mix(in srgb, var(--brand) 35%, var(--line)); transform: translateY(-1px); box-shadow: var(--shadow); }
    .issue-severity { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 9px; color: var(--danger); background: var(--danger-soft); }
    .issue-severity svg { width: 16px; height: 16px; }
    .issue-title { color: var(--ink); font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; font-weight: 700; word-break: break-word; }
    .issue-summary { margin-top: 5px; color: var(--muted); font-size: 12px; }
    .issue-meta { display: flex; flex-wrap: wrap; gap: 13px; margin-top: 10px; color: var(--faint); font-size: 10px; }
    .issue-meta span { display: inline-flex; align-items: center; gap: 5px; }
    .issue-meta svg { width: 12px; height: 12px; }
    .issue-side { display: grid; justify-items: end; gap: 9px; }
    .empty { padding: 64px 24px; border: 1px dashed var(--line); border-radius: var(--radius); text-align: center; background: var(--surface); color: var(--muted); }
    .empty svg { width: 32px; height: 32px; margin: 0 auto 12px; color: var(--faint); }
    .progress-cell { min-width: 135px; }
    .progress-cell > div { display: flex; align-items: center; gap: 10px; }
    .risk-track { width: 86px; }
    .risk-track i { background: var(--warning); }
    .run-card-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; margin-bottom: 16px; }
    .run-card { padding: 18px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); box-shadow: var(--shadow); }
    .run-card-top { display: flex; justify-content: space-between; gap: 10px; }
    .run-card h3 { margin: 0; color: var(--ink); font-size: 14px; }
    .run-card p { margin: 5px 0 0; color: var(--muted); font-size: 11px; }
    .run-card-stats { display: flex; gap: 20px; margin-top: 18px; }
    .run-card-stats span { color: var(--muted); font-size: 10px; }
    .run-card-stats strong { display: block; color: var(--ink); font-size: 18px; }
    .drawer-backdrop { position: fixed; inset: 0; z-index: 39; background: rgba(6, 8, 15, .45); opacity: 0; pointer-events: none; transition: .2s; backdrop-filter: blur(2px); }
    .drawer { position: fixed; inset: 0 0 0 auto; z-index: 40; width: min(590px, 94vw); padding: 23px; overflow: auto; background: var(--surface); box-shadow: -16px 0 48px rgba(7,10,20,.18); transform: translateX(101%); transition: transform .25s ease; }
    body.drawer-open { overflow: hidden; }
    body.drawer-open .drawer-backdrop { opacity: 1; pointer-events: auto; }
    body.drawer-open .drawer { transform: none; }
    .drawer-head { display: flex; justify-content: space-between; gap: 16px; align-items: start; padding-bottom: 19px; border-bottom: 1px solid var(--line); }
    .drawer-head h2 { margin: 7px 0 0; color: var(--ink); font: 700 15px/1.45 ui-monospace, SFMono-Regular, Consolas, monospace; word-break: break-word; }
    .drawer-section { padding: 20px 0; border-bottom: 1px solid var(--line); }
    .drawer-section h3 { margin: 0 0 11px; color: var(--ink); font-size: 12px; letter-spacing: .02em; }
    .drawer-section p { margin: 0; color: var(--muted); }
    .evidence, .steps { margin: 0; padding-left: 21px; }
    .evidence li, .steps li { margin: 8px 0; }
    .evidence code { padding: 3px 6px; border-radius: 5px; background: var(--surface-2); color: var(--text); font-size: 11px; word-break: break-word; }
    .log { max-height: 330px; overflow: auto; padding: 14px; border-radius: 9px; background: #11141d; color: #d7dbea; white-space: pre-wrap; word-break: break-word; font: 11px/1.65 ui-monospace, SFMono-Regular, Consolas, monospace; }
    .artifact-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .artifact-list a { display: inline-flex; align-items: center; gap: 6px; padding: 7px 9px; border: 1px solid var(--line); border-radius: 7px; color: var(--brand); text-decoration: none; font-size: 11px; }
    .artifact-list a svg { width: 13px; height: 13px; }
    .mobile-menu { display: none; }
    .toast { position: fixed; right: 24px; bottom: 24px; z-index: 60; padding: 11px 15px; border-radius: 9px; background: var(--ink); color: var(--surface); box-shadow: var(--shadow); font-size: 12px; transform: translateY(20px); opacity: 0; pointer-events: none; transition: .2s; }
    .toast.show { transform: none; opacity: 1; }
    @media (max-width: 1050px) { .metrics { grid-template-columns: repeat(2, 1fr); } .grid-main { grid-template-columns: 1fr; } .run-card-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 760px) {
      .sidebar { width: 244px; transform: translateX(-100%); transition: .2s; box-shadow: 12px 0 36px rgba(0,0,0,.2); }
      body.menu-open .sidebar { transform: none; }
      .shell { margin-left: 0; } .topbar { height: 62px; padding: 0 16px; } .mobile-menu { display: grid; }
      .content { padding: 24px 16px 50px; } .page-head { align-items: flex-start; flex-direction: column; }
      .metrics { grid-template-columns: 1fr 1fr; } .metric { min-height: 116px; padding: 16px; } .metric-value { font-size: 26px; }
      .toolbar { align-items: stretch; flex-direction: column; } .select { width: 100%; }
      .run-card-grid { grid-template-columns: 1fr; } .issue { grid-template-columns: 34px minmax(0,1fr); } .issue-side { grid-column: 2; justify-items: start; }
      .donut-row { grid-template-columns: 120px 1fr; } .donut { width: 120px; }
    }
    @media (max-width: 460px) { .metrics { grid-template-columns: 1fr; } .export-btn span { display: none; } }
  </style>
</head>
<body>
  <svg width="0" height="0" aria-hidden="true" style="position:absolute">
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></symbol>

  <div class="app">

      <div class="logo"><div class="logo-mark"><svg><use href="#i-pulse"/></svg></div><div><strong>FailLens</strong><small>QUALITY INTELLIGENCE</small></div></div>

  <script type="application/json" id="report-data">__REPORT_DATA__</script>
  <script>
    let data;
    try {
      const raw = document.getElementById('report-data').textContent;
      if (raw.includes('__REPORT_' + 'DATA__')) throw new Error('template-source');
      data = JSON.parse(raw);
    } catch (error) {
      document.body.innerHTML = `<main style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f6fa;font:14px/1.65 system-ui;color:#353a48"><section style="max-width:620px;padding:32px;border:1px solid #e7e9ef;border-radius:16px;background:white;box-shadow:0 12px 38px rgba(24,29,44,.08)"><b style="display:block;color:#5b5bd6;letter-spacing:.14em">FAILLENS TEMPLATE</b><h1 style="margin:10px 0 8px;color:#1b1f2a">这里是报告模板，不是可运行的报告</h1><p>模板需要注入 JUnit 分析数据后才能使用。请打开 <code>output/professional/report.html</code>，或者在项目目录运行：</p><pre style="padding:13px;border-radius:9px;background:#171923;color:#e8eaf1;overflow:auto">python -m faillens analyze examples/runs --output output/professional\npython -m faillens serve output/professional --open</pre></section></main>`;
      throw error;
    }
    const colors = {locator_failure:'#776ce9',network_timeout:'#4c8fe8',test_data_issue:'#e49b44',environment_issue:'#8992a7',application_error:'#e36175',assertion_failure:'#bb6bd9',unknown:'#718096'};
    const labels = {overview:'质量概览',issues:'失败诊断',stability:'稳定性分析',runs:'运行记录'};
    const statusText = {passed:'通过',failed:'失败',error:'错误',skipped:'跳过'};
    const icon = name => `<svg aria-hidden="true"><use href="#i-${name}"/></svg>`;
    const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
    const pct = value => `${Math.round(Number(value || 0))}%`;
    const date = value => { if(!value) return '未记录'; const d=new Date(value); return Number.isNaN(d.getTime()) ? value : new Intl.DateTimeFormat('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).format(d); };
    const duration = value => Number(value || 0) < 1 ? `${Math.round(Number(value || 0)*1000)} ms` : `${Number(value || 0).toFixed(2)} s`;
    const failed = data.results.filter(x => ['failed','error'].includes(x.result.status));
    const latestRun = data.runs.at(-1);
    document.getElementById('issue-count').textContent = failed.length;
    document.getElementById('flaky-count').textContent = data.dashboard.flaky;
    document.getElementById('latest-run').textContent = latestRun?.run_id || '本次运行';
    document.getElementById('side-status-text').textContent = `${data.results.length} 条记录 · ${failed.length} 个问题已归类`;

    function badge(category, label) { const color=colors[category] || colors.unknown; return `<span class="badge" style="color:${color};background:${color}16">${esc(label)}</span>`; }
    function metric(label, value, note, iconName, tone='brand') { return `<article class="metric"><div class="metric-top"><span class="metric-label">${label}</span><span class="metric-icon" style="color:var(--${tone});background:var(--${tone}-soft, var(--brand-soft))">${icon(iconName)}</span></div><div class="metric-value">${value}</div><div class="metric-note">${note}</div></article>`; }

    function trendChart(items) {
      if (!items.length) return '<div class="empty">暂无趋势数据</div>';
      const width=700,height=210,pad={l:38,r:16,t:18,b:32}, max=100;
      const x=i => pad.l + (items.length===1 ? (width-pad.l-pad.r)/2 : i*(width-pad.l-pad.r)/(items.length-1));
      const y=v => pad.t + (max-v)*(height-pad.t-pad.b)/max;
      const points=items.map((r,i)=>`${x(i)},${y(r.pass_rate)}`).join(' ');
      const area=`${pad.l},${height-pad.b} ${points} ${x(items.length-1)},${height-pad.b}`;
      const grids=[0,25,50,75,100].map(v=>`<line class="chart-grid" x1="${pad.l}" y1="${y(v)}" x2="${width-pad.r}" y2="${y(v)}"/><text class="chart-label" x="2" y="${y(v)+4}">${v}%</text>`).join('');
      const dots=items.map((r,i)=>`<circle class="chart-dot" cx="${x(i)}" cy="${y(r.pass_rate)}" r="4"><title>${esc(r.run_id)} · ${r.pass_rate}%</title></circle><text class="chart-label" text-anchor="middle" x="${x(i)}" y="${height-8}">${esc(r.run_id)}</text>`).join('');
      return `<svg viewBox="0 0 ${width} ${height}"><defs><linearGradient id="areaGradient" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--brand)" stop-opacity=".55"/><stop offset="1" stop-color="var(--brand)" stop-opacity="0"/></linearGradient></defs>${grids}<polygon class="chart-area" points="${area}"/><polyline class="chart-line" points="${points}"/>${dots}</svg>`;
    }

    function distribution() {
      const items=data.dashboard.categories, total=items.reduce((s,x)=>s+x.count,0) || 1; let cursor=0;
      const segments=items.map(x=>{const from=cursor;cursor+=x.count/total*360;return `${colors[x.key]||colors.unknown} ${from}deg ${cursor}deg`;}).join(',');
      const list=items.map(x=>`<div class="category"><i style="background:${colors[x.key]||colors.unknown}"></i><span>${esc(x.label)}</span><b>${x.count}</b></div>`).join('');
      return `<div class="distribution"><div class="donut-row"><div class="donut" style="background:conic-gradient(${segments || 'var(--line) 0 360deg'})"><div class="donut-center"><strong>${data.dashboard.failed}</strong><span>失败记录</span></div></div><div class="category-list">${list || '<span class="muted">暂无失败</span>'}</div></div></div>`;
    }

    function overviewRows() {
      return failed.slice(0,5).map((item,index)=>`<tr data-action="issue" data-index="${index}"><td><div class="test-name">${esc(item.result.test_id)}</div></td><td>${badge(item.diagnosis?.category,item.diagnosis?.label||'暂未识别')}</td><td><div class="confidence"><div class="confidence-track"><i style="width:${pct((item.diagnosis?.confidence||0)*100)}"></i></div>${pct((item.diagnosis?.confidence||0)*100)}</div></td><td>${duration(item.result.duration)}</td><td>${esc(item.result.run.run_id)}</td></tr>`).join('');
    }

    function renderOverview() {
      const d=data.dashboard;
      document.getElementById('overview-root').innerHTML=`
        <div class="metrics">
          ${metric('质量健康度',d.health_score,'综合通过率与稳定性风险','pulse')}
          ${metric('整体通过率',`${d.pass_rate}%`,`<strong>${d.passed}</strong> / ${d.total} 条执行记录`,'check','success')}
          ${metric('待处理失败',d.failed,`${d.categories.length} 类根因已识别`,'alert','danger')}
          ${metric('不稳定用例',d.flaky,`${d.unique_tests} 个唯一测试用例`,'clock','warning')}
        </div>
        <div class="grid-main">
          <article class="panel"><div class="panel-head"><div><div class="panel-title">通过率趋势</div><div class="panel-subtitle">按测试运行观察质量变化</div></div><div class="legend"><span><i style="background:var(--brand)"></i>通过率</span></div></div><div class="chart-wrap">${trendChart(d.run_trend)}</div></article>
          <article class="panel"><div class="panel-head"><div><div class="panel-title">失败原因分布</div><div class="panel-subtitle">基于可解释规则自动聚类</div></div></div>${distribution()}</article>
        </div>
        <div class="section-row"><h2>最近失败</h2><button class="text-btn" data-goto="issues">查看全部 →</button></div>
        <article class="panel table-wrap"><table><thead><tr><th>测试用例</th><th>诊断类型</th><th>置信度</th><th>耗时</th><th>运行</th></tr></thead><tbody>${overviewRows() || '<tr><td colspan="5">暂无失败记录</td></tr>'}</tbody></table></article>`;
    }

    function issueCard(item,index) {
      const d=item.diagnosis||{}, r=item.result;
      return `<article class="issue" data-action="issue" data-index="${index}" data-category="${esc(d.category||'unknown')}" data-search="${esc((r.test_id+' '+(r.message||'')+' '+(d.summary||'')).toLowerCase())}"><div class="issue-severity">${icon('alert')}</div><div><div class="issue-title">${esc(r.test_id)}</div><div class="issue-summary">${esc(d.summary||'尚未获得足够证据，需要人工检查完整日志。')}</div><div class="issue-meta"><span>${icon('clock')}${duration(r.duration)}</span><span>${icon('code')}${esc(r.run.run_id)}</span><span>${icon('file')}${item.artifact_links.length} 个附件</span></div></div><div class="issue-side">${badge(d.category,d.label||'暂未识别')}<span class="muted" style="font-size:10px">置信度 ${pct((d.confidence||0)*100)}</span></div></article>`;
    }

    function renderIssues() {
      const options=data.dashboard.categories.map(x=>`<option value="${esc(x.key)}">${esc(x.label)} (${x.count})</option>`).join('');
      document.getElementById('issues-root').innerHTML=`<div class="toolbar"><label class="search">${icon('search')}<input id="issue-search" placeholder="搜索测试名称、异常或诊断结论" autocomplete="off"></label><select class="select" id="category-filter"><option value="all">全部失败类型</option>${options}</select></div><div class="issues-list" id="issues-list">${failed.map(issueCard).join('')||`<div class="empty">${icon('check')}没有需要处理的失败</div>`}</div>`;
      const search=document.getElementById('issue-search'), select=document.getElementById('category-filter');
      const apply=()=>document.querySelectorAll('.issue').forEach(el=>el.hidden=!((select.value==='all'||el.dataset.category===select.value)&&(!search.value.trim()||el.dataset.search.includes(search.value.trim().toLowerCase()))));
      search.addEventListener('input',apply); select.addEventListener('change',apply);
    }

    function renderStability() {
      const rows=data.histories.map(h=>`<tr><td><div class="test-name">${esc(h.test_id)}</div></td><td>${h.is_flaky?'<span class="badge warning">FLAKY</span>':'<span class="badge success">稳定</span>'}</td><td>${h.runs}</td><td>${h.passed}</td><td>${h.failed}</td><td class="progress-cell"><div><div class="risk-track"><i style="width:${pct(h.flaky_score*100)}"></i></div>${pct(h.flaky_score*100)}</div></td><td><span class="badge ${h.latest_status==='passed'?'success':'danger'}">${statusText[h.latest_status]||h.latest_status}</span></td></tr>`).join('');
      document.getElementById('stability-root').innerHTML=`<article class="panel table-wrap"><table><thead><tr><th>测试用例</th><th>稳定性</th><th>运行次数</th><th>通过</th><th>失败</th><th>Flaky 分数</th><th>最新状态</th></tr></thead><tbody>${rows}</tbody></table></article>`;
    }

    function renderRuns() {
      const cards=data.dashboard.run_trend.slice().reverse().map((r,i)=>{const meta=data.runs.find(x=>x.run_id===r.run_id)||{};return `<article class="run-card"><div class="run-card-top"><div><h3>${esc(r.run_id)}</h3><p>${date(meta.timestamp)} · ${esc(meta.environment||'未标注环境')}</p></div><span class="badge ${r.failed?'danger':'success'}">${r.failed?'存在失败':'全部通过'}</span></div><div class="run-card-stats"><div><strong>${r.pass_rate}%</strong><span>通过率</span></div><div><strong>${r.passed}</strong><span>通过</span></div><div><strong>${r.failed}</strong><span>失败</span></div></div></article>`}).join('');
      const rows=data.runs.slice().reverse().map(r=>`<tr><td><b>${esc(r.run_id)}</b></td><td>${date(r.timestamp)}</td><td>${esc(r.environment||'-')}</td><td>${esc(r.branch||'-')}</td><td><code>${esc(r.commit||'-')}</code></td><td><code>${esc(r.source)}</code></td></tr>`).join('');
      document.getElementById('runs-root').innerHTML=`<div class="run-card-grid">${cards}</div><article class="panel table-wrap"><table><thead><tr><th>运行</th><th>时间</th><th>环境</th><th>分支</th><th>Commit</th><th>数据源</th></tr></thead><tbody>${rows}</tbody></table></article>`;
    }

    function openIssue(index) {
      const item=failed[index]; if(!item) return; const d=item.diagnosis||{},r=item.result;
      const evidence=(d.evidence||[]).map(x=>`<li><code>${esc(x)}</code></li>`).join('')||'<li>没有足够的规则证据</li>';
      const steps=(d.suggestions||[]).map(x=>`<li>${esc(x)}</li>`).join('');
      const artifacts=item.artifact_links.map(x=>`<a href="${esc(x)}" target="_blank">${icon('file')}${esc(x.split('/').at(-1))}</a>`).join('')||'<span class="muted">没有关联附件</span>';
      document.getElementById('drawer-root').innerHTML=`<div class="drawer-head"><div>${badge(d.category,d.label||'暂未识别')}<h2>${esc(r.test_id)}</h2></div><button class="icon-btn" id="drawer-close" aria-label="关闭">${icon('x')}</button></div><section class="drawer-section"><h3>诊断结论</h3><p>${esc(d.summary||'需要人工分析')}</p><div class="issue-meta" style="margin-top:13px"><span>置信度 ${pct((d.confidence||0)*100)}</span><span>${duration(r.duration)}</span><span>${esc(r.run.run_id)}</span><span>${esc(r.run.environment||'未知环境')}</span></div></section><section class="drawer-section"><h3>命中证据</h3><ul class="evidence">${evidence}</ul></section><section class="drawer-section"><h3>建议排查步骤</h3><ol class="steps">${steps}</ol></section><section class="drawer-section"><h3>关联附件</h3><div class="artifact-list">${artifacts}</div></section><section class="drawer-section"><h3>原始日志</h3><pre class="log">${esc([r.message,r.stacktrace,r.stdout,r.stderr].filter(Boolean).join('\n'))}</pre><button class="text-btn" id="copy-log" style="margin-top:8px">复制日志</button></section>`;
      document.body.classList.add('drawer-open');
      document.getElementById('drawer-close').onclick=closeDrawer;
      document.getElementById('copy-log').onclick=async()=>{try{await navigator.clipboard.writeText([r.message,r.stacktrace,r.stdout,r.stderr].filter(Boolean).join('\n'));showToast();}catch(_){showToast('浏览器未允许复制');}};
    }
    function closeDrawer(){document.body.classList.remove('drawer-open');}
    function showToast(text='已复制到剪贴板'){const t=document.getElementById('toast');t.textContent=text;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800);}
    function switchView(name, updateHash=true) {
      if (!labels[name]) name='overview';
      document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===`view-${name}`));
      document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===name));
      document.getElementById('crumb').textContent=labels[name];
      const subtitles={overview:'持续观察自动化测试质量、失败原因与稳定性风险。',issues:`${failed.length} 个失败已完成规则诊断，可按类型和关键词筛选。`,stability:'识别重复失败、时好时坏以及长期不稳定的测试用例。',runs:'查看每次流水线的版本、环境与执行结果。'};
      document.getElementById('page-subtitle').textContent=subtitles[name];
      document.body.classList.remove('menu-open');
      if (updateHash && location.hash !== `#${name}`) history.replaceState(null,'',`#${name}`);
      window.scrollTo({top:0,behavior:'smooth'});
    }

    renderOverview(); renderIssues(); renderStability(); renderRuns();
    document.addEventListener('click',e=>{const nav=e.target.closest('[data-view]');if(nav)switchView(nav.dataset.view);const go=e.target.closest('[data-goto]');if(go)switchView(go.dataset.goto);const row=e.target.closest('[data-action="issue"]');if(row)openIssue(Number(row.dataset.index));});
    document.getElementById('drawer-backdrop').onclick=closeDrawer;
    document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDrawer();document.body.classList.remove('menu-open');}});
    document.getElementById('menu-btn').onclick=()=>document.body.classList.toggle('menu-open');
    const preferred=localStorage.getItem('faillens-theme')||'light';document.documentElement.dataset.theme=preferred;
    document.getElementById('theme-btn').onclick=()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem('faillens-theme',next);};
    switchView(location.hash.slice(1) || 'overview', false);
    window.addEventListener('hashchange',()=>switchView(location.hash.slice(1),false));
  </script>
</body>
</html>
